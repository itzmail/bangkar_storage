name: Deploy

on:
  # Deploy on every push to main, or manually from the Actions tab
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: "production"
        type: choice
        options:
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Only the repository owner may trigger deploys
    if: github.actor == 'itzmail'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd ${{ vars.VPS_APP_DIR || '/opt/apps/bangkar' }}
            git fetch --all --prune
            git checkout main
            git pull origin main
            # Apply DB migrations (one-shot service)
            docker compose -f docker-compose.prod.yml --env-file .env run --rm migrate
            # Rebuild + restart app and infra (remove orphan containers)
            docker compose -f docker-compose.prod.yml --env-file .env up -d --build --remove-orphans
            docker image prune -f
