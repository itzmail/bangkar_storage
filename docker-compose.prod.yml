# Production stack for Bangkar — MariaDB + MinIO + app
# Required env vars (create .env on the VPS from .env.production.example):
#   MARIADB_ROOT_PASSWORD, MARIADB_PASSWORD, MINIO_ROOT_PASSWORD,
#   AUTH_SECRET, DATABASE_URL (host: mariadb), S3_ENDPOINT (http://minio:9000),
#   NEXT_PUBLIC_APP_URL (public https URL)

services:
  mariadb:
    image: mariadb:11
    container_name: bangkar-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: bangkar
      MARIADB_USER: bangkar
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?required}
    # No host port binding — DB is reachable only inside the docker network
    # (app/migrate use host "mariadb:3306"). Avoids conflicts with any
    # host-level MySQL/MariaDB and keeps the DB off the host interface.
    volumes:
      - bangkar_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bangkar_net

  minio:
    image: minio/minio:latest
    container_name: bangkar-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bangkar_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    command: server /data --console-address ":9001"
    # MinIO is exposed on the docker network only; a reverse proxy
    # (Caddy) in front publishes it at a public domain. The browser needs
    # a publicly reachable S3 endpoint for presigned uploads/downloads.
    expose:
      - "9000"
      - "9001"
    volumes:
      - bangkar_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bangkar_net

  minio-init:
    image: minio/mc:latest
    container_name: bangkar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bangkar_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/bangkar-files &&
      mc anonymous set download local/bangkar-files &&
      echo 'MinIO bucket bangkar-files initialized'
      "
    networks:
      - bangkar_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bangkar-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-bangkar_admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:-bangkar-files}
      S3_FORCE_PATH_STYLE: "true"
      AUTH_SECRET: ${AUTH_SECRET:?required}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
    # Reverse proxy (Caddy) reaches the app inside the docker network.
    expose:
      - "3000"
    networks:
      - bangkar_net

  # One-shot migration runner — exits after applying pending migrations
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pnpm exec prisma migrate deploy"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
    networks:
      - bangkar_net
    restart: "no"

  # Caddy — automatic HTTPS reverse proxy for the app + MinIO
  # Publishes app at ${APP_DOMAIN} and MinIO at ${MINIO_DOMAIN}
  caddy:
    image: caddy:2-alpine
    container_name: bangkar-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?required}
      MINIO_DOMAIN: ${MINIO_DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - bangkar_caddy_data:/data
      - bangkar_caddy_config:/config
    networks:
      - bangkar_net

volumes:
  bangkar_mariadb_data:
  bangkar_minio_data:
  bangkar_caddy_data:
  bangkar_caddy_config:

networks:
  bangkar_net:
    driver: bridge
