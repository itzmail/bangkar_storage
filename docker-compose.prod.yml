# Production stack for Bangkar — MariaDB + MinIO + app
# Required env vars (create .env on the VPS from .env.production.example):
#   MARIADB_ROOT_PASSWORD, MARIADB_PASSWORD, MINIO_ROOT_PASSWORD,
#   AUTH_SECRET, DATABASE_URL (host: mariadb), S3_ENDPOINT (http://minio:9000),
#   NEXT_PUBLIC_APP_URL (public https URL)

services:
  mariadb:
    image: mariadb:11
    container_name: bangkar-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?required}
      MARIADB_DATABASE: bangkar
      MARIADB_USER: bangkar
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?required}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - bangkar_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bangkar_net

  minio:
    image: minio/minio:latest
    container_name: bangkar-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bangkar_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - bangkar_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bangkar_net

  minio-init:
    image: minio/mc:latest
    container_name: bangkar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bangkar_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/bangkar-files &&
      mc anonymous set download local/bangkar-files &&
      echo 'MinIO bucket bangkar-files initialized'
      "
    networks:
      - bangkar_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bangkar-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-bangkar_admin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      S3_BUCKET: ${S3_BUCKET:-bangkar-files}
      S3_FORCE_PATH_STYLE: "true"
      AUTH_SECRET: ${AUTH_SECRET:?required}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - bangkar_net

  # One-shot migration runner — exits after applying pending migrations
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "pnpm exec prisma migrate deploy"
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
    networks:
      - bangkar_net
    restart: "no"

volumes:
  bangkar_mariadb_data:
  bangkar_minio_data:

networks:
  bangkar_net:
    driver: bridge
