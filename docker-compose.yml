# Required environment variables (set in your .env file or pass via `docker compose --env-file .env up`):
#   MARIADB_USER (default: bangkar)
#   MARIADB_PASSWORD (no default; required)
#   MARIADB_ROOT_PASSWORD (no default; required)
#   MARIADB_DATABASE (default: bangkar)
#   MINIO_ROOT_USER (default: bangkar_admin)
#   MINIO_ROOT_PASSWORD (no default; required)
#
# Generate secrets with: openssl rand -base64 32

services:
  mariadb:
    image: mariadb:11
    container_name: bangkar-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?mariadb root password required}
      MARIADB_DATABASE: bangkar
      MARIADB_USER: bangkar
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?mariadb password required}
    ports:
      - "3306:3306"
    volumes:
      - bangkar_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: bangkar-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: bangkar_admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?minio password required}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - bangkar_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: bangkar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?minio user required} ${MINIO_ROOT_PASSWORD:?minio password required} &&
      mc mb --ignore-existing local/bangkar-files &&
      mc anonymous set download local/bangkar-files &&
      echo 'MinIO bucket bangkar-files initialized'
      "

volumes:
  bangkar_mariadb_data:
  bangkar_minio_data:
